<figcaption>위에서 아래로 시간이 흐릅니다. 실선은 이어받음, 점선은 인용·대비, 점점선은 측정이고, 색이 들어간 선은 STOP의 자기 적용을 직접 이어받은 연결입니다. 선 위의 위치(§, App)는 그 내용이 적힌 후속 논문의 절입니다. DGM과 HGM도 STOP을 인용하지만 그림에서는 뺐습니다. 논문을 누르면 아래 연대기의 해당 항목으로 갑니다. HGM은 Huxley-Gödel Machine, Inheritance는 Improvement by Inheritance입니다.</figcaption>
