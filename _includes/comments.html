<section class="comments">
  <div class="giscus"></div>
  <script>
    (function () {
      var root = document.documentElement;
      var theme = root.getAttribute('data-theme') ||
        (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      var attrs = {
        'data-repo': {{ site.giscus.repo | jsonify }},
        'data-repo-id': {{ site.giscus.repo_id | jsonify }},
        'data-category': {{ site.giscus.category | jsonify }},
        'data-category-id': {{ site.giscus.category_id | jsonify }},
        'data-mapping': 'pathname',
        'data-strict': '0',
        'data-reactions-enabled': '1',
        'data-emit-metadata': '0',
        'data-input-position': 'bottom',
        'data-theme': theme,
        'data-lang': 'ko',
        'data-loading': 'lazy'
      };
      var script = document.createElement('script');
      script.src = 'https://giscus.app/client.js';
      script.crossOrigin = 'anonymous';
      script.async = true;
      for (var key in attrs) script.setAttribute(key, attrs[key]);
      document.currentScript.parentNode.appendChild(script);
    })();
  </script>
</section>
