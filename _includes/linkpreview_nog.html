{%- comment -%}
  링크 미리보기 카드. Open Graph 태그가 없는 페이지용으로, 썸네일 없이 그린다.
  나머지는 linkpreview.html과 같다.
{%- endcomment -%}
<div class="link-card">
<a href="{{ url | escape }}" target="_blank" rel="noopener noreferrer">
<span class="link-card-body">
<span class="link-card-title">{{ title | escape }}</span>
{%- if description %}
<span class="link-card-desc">{{ description | escape }}</span>
{%- endif %}
<span class="link-card-domain">{{ domain | escape }}</span>
</span>
</a>
</div>
