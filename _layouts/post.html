---
layout: default
---
<article class="post">
  <header class="post-header">
    <h1>{{ page.title }}</h1>
    <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: '%Y.%m.%d' }}</time>
  </header>

  <div class="post-body">
    <nav class="toc" aria-label="목차" hidden></nav>
    <div class="prose">
      {{ content }}
    </div>
  </div>

  {% include comments.html %}
</article>
<script src="{{ '/assets/js/post.js' | relative_url }}?v={{ site.time | date: '%s' }}" defer></script>
