# STOP 연대기. 글에서 include 태그에 timeline.html name="stop"을 넘겨 넣는다.
# - date: arXiv 첫 공개 월. arXiv판이 없는 심사 중 논문은 OpenReview 투고 시기.
# - tag, tone: 이 논문이 STOP과 어떤 관계인지. tone은 focus(STOP) | strong(STOP을 이어받음) | plain(STOP을 인용) | muted(선행·간접)
# - award: 공식 페이지에서 확인한 Spotlight·Oral만 적는다.
# - links: 이 논문이 앞선 논문에서 가져온 것. from은 이 파일의 id, kind는 inherits | cites | measures. 괄호는 그 내용이 적힌 위치.
caption: >-
  날짜는 arXiv 첫 공개 월이고, 심사 중인 두 편은 ICLR 2027 투고 시기입니다.
  논문마다 아래 줄은 앞선 논문에서 무엇을 가져왔는지와 그 내용이 적힌 위치입니다.
  학회 배지는 공식 페이지에서 확인한 Spotlight·Oral만 표시했습니다.
