title: onsidequest
url: "https://onsidequest.github.io"
baseurl: ""
lang: ko
timezone: Asia/Seoul

author:
  name: onsidequest
  github: onsidequest

permalink: /posts/:title/

giscus:
  repo: onsidequest/onsidequest.github.io
  repo_id: R_kgDOVZHPRA
  category: Announcements
  category_id: DIC_kwDOVZHPRM4DJvGi

markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter: rouge
  hard_wrap: false

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
  - scope:
      path: ""
      type: pages
    values:
      layout: page

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - .bundle
